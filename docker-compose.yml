# Alternativa k `npm run db:local` pro vývojáře s Dockerem.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flauto
    ports:
      - "5432:5432"
    volumes:
      - flauto-db:/var/lib/postgresql/data
volumes:
  flauto-db:
